apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tech-api
  template:
    metadata:
      labels:
        app: tech-api
    spec:
      containers:
        - name: fastapi
          image: your-dockerhub-user/tech-api:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: tech-config
            - secretRef:
                name: tech-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
