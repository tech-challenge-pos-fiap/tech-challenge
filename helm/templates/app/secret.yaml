apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.secret.name }}
  namespace: {{ .Values.api.namespace | default "default" }}
type: Opaque
stringData:
  MP_ACCESS_TOKEN: {{ .Values.api.secret.stringData.MP_ACCESS_TOKEN | quote }}
  DATABASE_URL: {{ .Values.api.secret.stringData.DATABASE_URL | quote }}
