apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}-deployment
  namespace: {{ .Values.api.namespace | default "default" }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.api.name }}
    spec:
      containers:
        - name: {{ .Values.api.name }}-container
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
          ports:
            - containerPort: {{ .Values.api.image.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ .Values.api.configMap.name }}
            - secretRef:
                name: {{ .Values.api.secret.name }}
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu }}
      initContainers:
        - name: alembic-migrations
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: {{ .Values.api.secret.name }}
