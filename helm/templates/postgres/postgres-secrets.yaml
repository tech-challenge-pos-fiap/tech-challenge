apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.secret.name }}
  namespace: {{ .Values.postgres.namespace | default "default" }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.secret.stringData.POSTGRES_DB }}
  POSTGRES_USER: {{ .Values.postgres.secret.stringData.POSTGRES_USER }}
  POSTGRES_PASSWORD: {{ .Values.postgres.secret.stringData.POSTGRES_PASSWORD }}
