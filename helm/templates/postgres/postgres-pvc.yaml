apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.postgres.pvc.name }}
  namespace: {{ .Values.postgres.namespace | default "default" }}
spec:
  accessModes:
    {{- range .Values.postgres.pvc.accessModes }}
    - {{ . }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.pvc.storage }}
